<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E1A"/>
      <stop offset="100%" stop-color="#171226"/>
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .a1 { opacity:0; animation: fadeUp .5s ease-out .1s forwards; }
    .a2 { opacity:0; animation: fadeUp .5s ease-out .2s forwards; }
    .a3 { opacity:0; animation: fadeUp .5s ease-out .3s forwards; }
    .a4 { opacity:0; animation: fadeUp .5s ease-out .4s forwards; }
    .a5 { opacity:0; animation: fadeUp .5s ease-out .5s forwards; }
  </style>

  <rect x="1.5" y="1.5" width="1197" height="257" rx="18" fill="url(#bg2)" stroke="#2DD4BF" stroke-opacity="0.4" stroke-width="1.5"/>

  <text x="36" y="48" font-family="ui-monospace, Menlo, monospace" font-size="15" letter-spacing="2" fill="#6F6A8C">PLAYER INFO</text>
  <rect x="36" y="60" width="48" height="3" fill="url(#bar)"/>

  <text x="36" y="98" font-family="ui-monospace, Menlo, monospace" font-size="18" fill="#B9B3D0">CLASS  <tspan fill="#F4F1FA" font-weight="700">Backend Developer</tspan></text>
  <text x="36" y="126" font-family="ui-monospace, Menlo, monospace" font-size="18" fill="#B9B3D0">GUILD  <tspan fill="#F4F1FA" font-weight="700">UNNE — Lic. en Sistemas</tspan></text>

  <text x="36" y="168" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="1.5" fill="#2DD4BF">USO A DIARIO</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="14" font-weight="600">
    <g class="a1" transform="translate(36,180)"><rect width="92" height="32" rx="16" fill="#0B0E1A" stroke="#2DD4BF" stroke-width="1.3"/><text x="46" y="21" fill="#2DD4BF" text-anchor="middle">PYTHON</text></g>
    <g class="a2" transform="translate(140,180)"><rect width="120" height="32" rx="16" fill="#0B0E1A" stroke="#2DD4BF" stroke-width="1.3"/><text x="60" y="21" fill="#2DD4BF" text-anchor="middle">POSTGRESQL</text></g>
    <g class="a3" transform="translate(272,180)"><rect width="150" height="32" rx="16" fill="#0B0E1A" stroke="#2DD4BF" stroke-width="1.3"/><text x="75" y="21" fill="#2DD4BF" text-anchor="middle">TELEGRAM API</text></g>
  </g>

  <text x="460" y="168" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="1.5" fill="#FB7185">SUBIENDO DE NIVEL</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="14" font-weight="600">
    <g class="a4" transform="translate(460,180)"><rect width="130" height="32" rx="16" fill="#0B0E1A" stroke="#FB7185" stroke-width="1.3"/><text x="65" y="21" fill="#FB7185" text-anchor="middle">PLAYWRIGHT</text></g>
    <g class="a5" transform="translate(602,180)"><rect width="108" height="32" rx="16" fill="#0B0E1A" stroke="#FB7185" stroke-width="1.3"/><text x="54" y="21" fill="#FB7185" text-anchor="middle">TESTING</text></g>
  </g>
</svg>
