    .b1 { opacity:0; animation: fadeUp .5s ease-out .05s forwards; }
    .b2 { opacity:0; animation: fadeUp .5s ease-out .12s forwards; }
    .b3 { opacity:0; animation: fadeUp .5s ease-out .19s forwards; }
    .b4 { opacity:0; animation: fadeUp .5s ease-out .26s forwards; }
    .b5 { opacity:0; animation: fadeUp .5s ease-out .33s forwards; }
    .b6 { opacity:0; animation: fadeUp .5s ease-out .40s forwards; }
    .b7 { opacity:0; animation: fadeUp .5s ease-out .47s forwards; }
    .b8 { opacity:0; animation: fadeUp .5s ease-out .54s forwards; }
    .b9 { opacity:0; animation: fadeUp .5s ease-out .61s forwards; }
  </style>

  <rect x="1.5" y="1.5" width="1197" height="227" rx="18" fill="url(#bg3)" stroke="#A78BFA" stroke-opacity="0.4" stroke-width="1.5"/>

  <text x="36" y="48" font-family="ui-monospace, Menlo, monospace" font-size="15" letter-spacing="2" fill="#6F6A8C">INVENTARIO</text>
