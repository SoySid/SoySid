    <g class="b3" transform="translate(268,84)"><rect width="92" height="34" rx="17" fill="#0B0E1A" stroke="#FB7185" stroke-width="1.3"/><text x="46" y="22" fill="#FB7185" text-anchor="middle">MYSQL</text></g>
    <g class="b4" transform="translate(368,84)"><rect width="76" height="34" rx="17" fill="#0B0E1A" stroke="#FFB86C" stroke-width="1.3"/><text x="38" y="22" fill="#FFB86C" text-anchor="middle">GIT</text></g>
