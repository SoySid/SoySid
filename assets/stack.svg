    <g class="b7" transform="translate(654,84)"><rect width="128" height="34" rx="17" fill="#0B0E1A" stroke="#FB7185" stroke-width="1.3"/><text x="64" y="22" fill="#FB7185" text-anchor="middle">PLAYWRIGHT</text></g>
