  </style>
  <rect width="1200" height="80" fill="url(#bgf)"/>
  <rect y="0" width="1200" height="3" fill="url(#accf)"/>
  <text x="600" y="47" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#6F6A8C" text-anchor="middle">&lt;/ gracias por pasar — nos vemos en el próximo commit <tspan class="cursor">&#9608;</tspan> /&gt;</text>
