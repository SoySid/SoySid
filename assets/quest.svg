<svg width="1200" height="200" viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B0E1A"/>
      <stop offset="100%" stop-color="#171226"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes pulse { 0%,100% { opacity: 0.35; } 50% { opacity: 0.85; } }
    .glow { animation: pulse 3s ease-in-out infinite; }
  </style>

  <rect x="1.5" y="1.5" width="1197" height="197" rx="18" fill="url(#bg4)" stroke="#FB7185" stroke-opacity="0.4" stroke-width="1.5"/>
  <rect class="glow" x="36" y="52" width="52" height="3" fill="url(#bar3)"/>

  <text x="36" y="44" font-family="ui-monospace, Menlo, monospace" font-size="15" letter-spacing="2" fill="#6F6A8C">QUEST LOG — completada</text>

  <text x="36" y="98" font-family="ui-monospace, Menlo, monospace" font-size="27" font-weight="700" fill="#F4F1FA">LlantitaBot</text>
  <text x="36" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#B9B3D0">Bot en Python para monitoreo de precios, scraping de catálogo, persistencia en</text>
  <text x="36" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#B9B3D0">PostgreSQL y alertas en tiempo real vía Telegram.</text>

  <text x="36" y="180" font-family="ui-monospace, Menlo, monospace" font-size="14.5" fill="#2DD4BF">&#9733; recompensa: automatización 24/7, cero precios revisados a mano</text>

  <text x="1164" y="180" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#6F6A8C" text-anchor="end">github.com/SoySid/LlantitaBot</text>
</svg>
