<svg width="1200" height="340" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E1A"/>
      <stop offset="55%" stop-color="#141126"/>
      <stop offset="100%" stop-color="#1B1330"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>
    <linearGradient id="accentV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes blink { 0%,45% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes pulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .cursor { animation: blink 1s steps(1) infinite; }
    .border { animation: pulse 3s ease-in-out infinite; }
    .chip1 { opacity: 0; animation: fadeUp .6s ease-out .2s forwards; }
    .chip2 { opacity: 0; animation: fadeUp .6s ease-out .4s forwards; }
    .chip3 { opacity: 0; animation: fadeUp .6s ease-out .6s forwards; }
    .chip4 { opacity: 0; animation: fadeUp .6s ease-out .8s forwards; }
  </style>

  <rect width="1200" height="340" fill="url(#bg)"/>

  <g fill="#A78BFA" opacity="0.18">
    <circle cx="40" cy="40" r="2.5"/><circle cx="72" cy="40" r="2.5"/><circle cx="104" cy="40" r="2.5"/>
    <circle cx="40" cy="72" r="2.5"/><circle cx="72" cy="72" r="2.5"/><circle cx="104" cy="72" r="2.5"/>
    <circle cx="40" cy="104" r="2.5"/><circle cx="72" cy="104" r="2.5"/><circle cx="104" cy="104" r="2.5"/>
    <circle cx="1100" cy="240" r="2.5"/><circle cx="1132" cy="240" r="2.5"/><circle cx="1164" cy="240" r="2.5"/>
    <circle cx="1100" cy="272" r="2.5"/><circle cx="1132" cy="272" r="2.5"/><circle cx="1164" cy="272" r="2.5"/>
    <circle cx="1100" cy="304" r="2.5"/><circle cx="1132" cy="304" r="2.5"/><circle cx="1164" cy="304" r="2.5"/>
  </g>

  <g stroke="url(#accent)" stroke-width="1.5" opacity="0.35" fill="none">
    <path d="M0,280 L120,280 L150,250 L260,250"/>
    <path d="M1200,70 L1080,70 L1050,100 L940,100"/>
  </g>

  <!-- cartucho -->
  <g transform="translate(75,90)">
    <rect x="0" y="0" width="170" height="180" rx="16" fill="#171226" stroke="url(#accent)" stroke-width="3"/>
    <rect x="16" y="16" width="138" height="38" rx="7" fill="#0B0E1A"/>
    <text x="85" y="41" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#A78BFA" text-anchor="middle">01000101</text>
    <text x="85" y="128" font-family="ui-monospace, Menlo, monospace" font-size="82" font-weight="700" fill="url(#accent)" text-anchor="middle">S</text>
    <rect x="16" y="147" width="138" height="18" rx="5" fill="url(#accentV)" opacity="0.85"/>
  </g>

  <!-- texto -->
  <text x="290" y="160" font-family="ui-monospace, Menlo, monospace" font-size="62" font-weight="700" fill="#F4F1FA">SoySid</text>
  <text x="292" y="198" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#B9B3D0">Backend Developer &#183; Python &#183; Bots &#183; Automatización</text>
  <text x="292" y="228" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#6F6A8C">&gt; estudiante de sistemas — unne — armando cosas que corren solas<tspan class="cursor">&#9608;</tspan></text>

  <!-- chips -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="14" font-weight="600">
    <g class="chip1" transform="translate(292,255)">
      <rect width="96" height="32" rx="16" fill="#0B0E1A" stroke="#2DD4BF" stroke-width="1.3"/>
      <text x="48" y="21" fill="#2DD4BF" text-anchor="middle">PYTHON</text>
    </g>
    <g class="chip2" transform="translate(400,255)">
      <rect width="122" height="32" rx="16" fill="#0B0E1A" stroke="#A78BFA" stroke-width="1.3"/>
      <text x="61" y="21" fill="#A78BFA" text-anchor="middle">POSTGRESQL</text>
    </g>
    <g class="chip3" transform="translate(534,255)">
      <rect width="112" height="32" rx="16" fill="#0B0E1A" stroke="#FB7185" stroke-width="1.3"/>
      <text x="56" y="21" fill="#FB7185" text-anchor="middle">TELEGRAM</text>
    </g>
    <g class="chip4" transform="translate(658,255)">
      <rect width="110" height="32" rx="16" fill="#0B0E1A" stroke="#FFB86C" stroke-width="1.3"/>
      <text x="55" y="21" fill="#FFB86C" text-anchor="middle">PLAYWRIGHT</text>
    </g>
  </g>

  <text x="1130" y="318" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#6F6A8C" text-anchor="end">INSERT COIN &#9656;</text>

  <rect class="border" x="1.5" y="1.5" width="1197" height="337" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.5"/>
</svg>
